version: "3.8"

services:
  postgres:
    image: postgres:17.4
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mydatabase}
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      timeout: 10s

  app:
    build:
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/configs
    environment:
      - DB_ADDRESS=postgres://${DB_USER:-myuser}:${DB_PASSWORD:-mypassword}@postgres:5432/${DB_NAME:-mydatabase}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: